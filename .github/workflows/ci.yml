name: API Validation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Construir imágenes
        run: docker compose build

      - name: 3. Iniciar entorno
        run: docker compose up -d

      - name: 4. Esperar y verificar logs
        run: |
          echo "Dando tiempo a la API para iniciar..."
          sleep 15
          docker compose logs api

      - name: 5. Healthcheck & Logic Validation
        run: |
          echo "Ejecutando Healthcheck con reintentos..."
          curl --retry 5 --retry-delay 5 -f http://localhost/health || exit 1
          
          echo "Validando lógica MD5..."
          curl -s -X POST http://localhost/validate-md5 \
            -H "Content-Type: application/json" \
            -d '{"data": 123, "md5": "202cb962ac59075b964b07152d234b70"}' | grep "202cb962ac59075b964b07152d234b70"

      - name: 6. Limpiar (opcional)
        if: always()
        run: docker compose down

