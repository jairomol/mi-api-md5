name: API Validation Pipeline

on: [push]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BUENA PRÁCTICA: Cache de capas de Docker para velocidad
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      # BUENA PRÁCTICA: Escaneo de seguridad (Checkov o similar)
      - name: Run Static Analysis
        run: |
          echo "Escaneando vulnerabilidades básicas..."
          # Aquí podrías usar herramientas como Trivy o Snyk

      - name: Start Environment
        run: docker compose up -d

      - name: Healthcheck & Logic Validation
        run: |
          # (Aquí van tus pruebas de curl que ya funcionan)
          sleep 10
          curl -f http://localhost/health || exit 1

